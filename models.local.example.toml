# 選用的本機模型覆寫範本。需要自訂模型分級或路由參數時，將本檔複製為：
#   <zMAHarness 設定目錄>/models.local.toml（與 harness.local.toml 同目錄）
# 例如 Windows 預設：%LOCALAPPDATA%/zMAHarness/models.local.toml
# 本檔不存在是正常情況；若本機覆寫檔語法或格式有誤，zMAHarness 會整份忽略並退回內建目錄，不擋派工。
# 不可取代內建目錄中 status = "refused" 的模型；但可以把任何模型設為 refused。

schema_version = 1

# [routing]
