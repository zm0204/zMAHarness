# zMAHarness 模型目錄。由維護者管理；程式只讀。
# 規則：表裡沒有的模型一律「未分級」，可手動指定，但不會自動推薦。不要讓程式或 AI 猜等級。
# 目錄只影響推薦，不影響授權：card create／dispatch 不讀這個檔；Orchestrator 由 registry 硬性拒絕。
schema_version = 1
updated = "2026-11-19"
tested_cli = { agy = "1.5.14", codex = "0.169.0", claude = "2.1.325" }

[routing]
tight_percent = 90
detect_ttl_hours = 12
quota_ttl_minutes = 10
agy_unknown_cooldown_minutes = 60
agy_cooldown_horizon_days = 8

# ───────────── Gemini（agy-print） ─────────────
[[models]]
key = "gemini-3.8-flash"
display = "Gemini 3.8 Flash"
family = "gemini"
status = "recommended"
cost = "economy"
billing = "subscription"
efforts = ["low", "medium", "high"]
aliases = ["flash"]
routes = [{ adapter = "agy-print", id = "gemini-3.8-flash-{effort}", quota = "agy:gemini" }]
note = "T3 大量整理與小型常規檢查；省額度備選。2026-11-19 重構後真實派工通過（flash-low）。"

[[models]]
key = "gemini-4-neon"
display = "Gemini 4 Neon"
family = "gemini"
status = "recommended"
cost = "premium"
billing = "subscription"
