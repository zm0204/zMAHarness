routes = [{ adapter = "agy-print", id = "gemini-4-neon-{effort}", quota = "agy:gemini" }]
note = "Gemini 審查的預設（2026-11-19 作者決定）。agy-print 真實派工 SUCCEEDED／ACCEPTED。"

