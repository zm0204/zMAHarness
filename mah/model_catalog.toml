# ───────────── 任務 × 等級 ─────────────
# 第一個通過篩選的候選就是選項 2。後面的候選只在前面的被排除（主控同家族、模式不支援、
# 帳號沒有、額度用完或冷卻中）時才會用到；標「額度備援」的是 3d 新增、原 SKILL 沒有的候選。

[[cells]]
task = "review"
level = "light"        # 小型常規檢查
picks = [
  { model = "gemini-3.8-flash", effort = "low" },
  { model = "claude-sonnet", effort = "low" },       # 額度備援
  { model = "gpt-6.2-sol", effort = "low" },         # 額度備援（Codex 主控會被排除）
]

[[cells]]
task = "review"
level = "standard"     # T2 核心邏輯／跨模組高風險 Review
picks = [
  # 只有非 GPT 主控（例如 Claude Code）且 Context-Bundle 時會選到；選項 3 照原 SKILL 用 Neon High。
  { model = "gpt-6.2-sol", effort = "medium", option3 = [{ model = "gemini-4-neon", effort = "high" }] },
  { model = "gemini-4-neon", effort = "medium" },
  { model = "claude-sonnet", effort = "medium" },    # 額度備援
]

[[cells]]
task = "review"
level = "deep"         # T2 跨模組交互複雜
picks = [
  { model = "gpt-6.2-sol", effort = "medium", option3 = [{ model = "gemini-4-neon", effort = "high" }] },
  { model = "gemini-4-neon", effort = "high" },
  { model = "claude-opus", effort = "high" },        # 額度備援
]

[[cells]]
task = "second_opinion"
level = "deep"         # T1 連續修復失敗；異質視角深度推理
picks = [
  { model = "gpt-6.2-sol", effort = "high", option3 = [{ model = "gemini-4-neon", effort = "high" }] },
  { model = "gemini-4-neon", effort = "high" },
  { model = "claude-opus", effort = "high" },
  { model = "claude-sonnet", effort = "high" },
]

[[cells]]
task = "research"
level = "light"        # T3 大量資料整理
picks = [
  { model = "gemini-3.8-flash", effort = "low" },
  { model = "claude-sonnet", effort = "low" },       # 額度備援
  { model = "gpt-6.2-sol", effort = "low" },         # 額度備援
]

[[cells]]
task = "research"
level = "standard"     # 需要整合較多線索
picks = [
  { model = "gemini-3.8-flash", effort = "medium" },
  { model = "claude-sonnet", effort = "medium" },    # 額度備援
  { model = "gpt-6.2-sol", effort = "medium" },      # 額度備援
]

# ───────────── 選項 3 ─────────────
[option3]
# 選項 2 是 premium 時（附錄 C D7：含非 Gemini 省額度備選）
save = [
  { model = "gemini-3.8-flash", effort = "low" },
  { model = "claude-sonnet", effort = "low" },
  { model = "gpt-6-luna", effort = "low" },
]
# 選項 2 是 economy 時
upgrade = [{ model = "gemini-4-neon", effort = "high" }]
