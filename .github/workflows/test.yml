name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: V1 offline tests
        run: python -B -m unittest -q
      - name: V2 offline tests
        run: python -B -m unittest discover -s tests/v2 -q
