# 將本範本複製到本機設定路徑，不要提交實際設定。
# Windows 預設：%LOCALAPPDATA%/zMAHarness/harness.local.toml
# 以下相對路徑以本機 TOML 所在目錄為基準。
[paths]
state_dir = "state"
worktree_root = "worktrees"
gui_workspace_root = "gui"

[adapters]
enabled = ["codex-exec", "gui-terra", "agy-print", "claude-print"]
codex_command = "codex"
# 可使用官方執行檔的完整路徑，或相對於本 TOML 的路徑。
agy_command = "agy"
# claude-print 只啟動原生 claude.exe；npm 安裝的 claude.cmd 會自動對應到套件內的 bin/claude.exe。
claude_command = "claude"

[approval]
# codex_prompt：主控寫入對話中的同意（也接受 manual_cli）。
# manual_cli：每張卡都須在互動終端機親手確認，主控寫入的 codex_prompt 一律拒絕。
mode = "codex_prompt"
grant_ttl_minutes = 240

[controller]
light_models = [] # 例如 ["gpt-5.6-luna"]
suggested_controller = "Codex Sol High"

[limits]
max_dispatches_per_grant = 5
max_concurrency = 1
max_effort = "high"
max_task_bytes = 32768
max_result_summary_chars = 2000

# 派工卡使用明確的 Adapter、模型和 effort。
[defaults]
review = { adapter = "agy-print", model = "gemini-3.8-flash-low", effort = "low" }
second_opinion = { adapter = "agy-print", model = "gemini-3.8-flash-low", effort = "low" }
research = { adapter = "agy-print", model = "gemini-3.8-flash-low", effort = "low" }
delegate_implement = { adapter = "codex-exec", effort = "medium" }

[triggers]
t1_failed_fix_rounds = 2
t2_risky_diff_lines = 80
t2_risky_paths = ["auth", "security", "migration", "permission"]
t3_read_files = 15
t3_read_kb = 200
t4_codex_used_percent = 70

[verify]
allowed_command_prefixes = ["pytest", "npm test", "npm run test", "dotnet test"]
timeout_s = 900

[privacy]
# 尚未實作：目前不會自動清理。請手動刪除 state/runs 與 worktrees 底下不再需要的舊資料。
retain_run_dirs_days = 30
